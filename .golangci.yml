linters:
  enable:
  - errcheck
  - govet
  - staticcheck
  - ineffassign
  - unused
  - misspell 
  - unconvert
  - revive
  - gocritic
  - nilerr
  - nolintlint
  - wastedassign
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive

issues:
  exclude-dirs:
    - migrations

run:
  timeout: 5m
